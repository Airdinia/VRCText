[package]
name = "vrctext"
version = "0.1.0"
edition = "2021"
description = "Lightweight VRChat OSC chatbox sender"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rosc = "0.10"
sherpa-onnx = { version = "1.12", default-features = false, features = ["static"] }
cpal = "0.16"
ureq = "2"
tar = "0.4"
bzip2 = "0.4"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_Speech",
    "Win32_Media_Audio",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
