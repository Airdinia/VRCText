[package]
name = "vrctext"
version = "0.2.4"
edition = "2021"
description = "Lightweight VRChat OSC chatbox sender"

[lib]
name = "vrctext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Opt-in DevTools: enable with `cargo tauri dev --features devtools`
# (or `--features=devtools` on cargo build). Release artefacts ship
# without the inspector / RPC overhead.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rosc = "0.10"
sherpa-onnx = { version = "1.12", default-features = false, features = ["static"] }
cpal = "0.16"
# Default `tls` feature = rustls + webpki-roots — pure Rust, no system TLS
# dep, auto-wired into Agent without us calling `tls_connector(...)`.
# (The legacy `native-tls` feature in ureq 2.x only *enables* a
# NativeTlsConnector type that the caller has to plug in manually; just
# flipping the feature flag isn't enough, and downloads fail at runtime
# with "no TLS backend is configured".)
ureq = "2"
tar = "0.4"
bzip2 = "0.4"
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_Speech",
    "Win32_Media_Audio",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
